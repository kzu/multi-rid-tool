# Builds AOT tool packages for each RID plus the agnostic pointer package.
# Pushes CI feed if secrets.SLEET_CONNECTION is provided.

name: Build AOT Tool Packages

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SLEET_FEED_URL: ${{ vars.SLEET_FEED_URL }}

jobs:
  build-platform-specific:
    strategy:
      fail-fast: false
      matrix:
        # the rid isn't required to _make_ the packages (we use --use-current-runtime), 
        # but it helps name the artifacts clearly and allows us to use the same workflow for all platforms.
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Install native VS workload
      if: runner.os == 'Windows'
      run: dnx --yes vs -- install --sku build -v:17 +vc --quiet --wait

    - name: Build AOT package for ${{ matrix.rid }}
      run: dotnet pack dotnetsay/dotnetsay.csproj -p:ToolType=aot --use-current-runtime

    - name: Upload platform-specific package
      uses: actions/upload-artifact@v4
      with:
        name: aot-package-${{ matrix.rid }}
        path: artifacts/package/release/*.nupkg
        retention-days: 30
        if-no-files-found: error

  build-agnostic:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4

    - name: Build agnostic AOT package
      run: dotnet pack dotnetsay/dotnetsay.csproj -p:ToolType=aot

    - name: Upload agnostic package
      uses: actions/upload-artifact@v4
      with:
        name: aot-package-agnostic
        path: artifacts/package/release/*.nupkg
        retention-days: 30
        if-no-files-found: error

  collect-all-packages:
    needs: [build-platform-specific, build-agnostic]
    runs-on: ubuntu-latest
    env:
      SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: collected-packages

    - name: List all collected packages
      run: |
        echo "All collected AOT packages:"
        find collected-packages -name "*.nupkg" -type f | sort
        echo ""
        echo "Package count: $(find collected-packages -name "*.nupkg" -type f | wc -l)"

    - name: Upload all packages as single artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-aot-packages
        path: collected-packages/**/*.nupkg
        retention-days: 90
        if-no-files-found: error

    - name: Setup .NET
      if: env.SLEET_CONNECTION != ''
      uses: actions/setup-dotnet@v4

    - name: Publish packages to CI feed
      if: env.SLEET_CONNECTION != ''
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem collected-packages -Recurse -Filter *.nupkg | Where-Object Name -NotLike '*.symbols.nupkg' | Sort-Object Name)
        $runtimePackagePattern = '\.(win-x64|win-arm64|linux-x64|linux-arm64|osx-x64|osx-arm64)\..+\.nupkg$'
        $runtimePackages = @($packages | Where-Object Name -Match $runtimePackagePattern)
        $pointerPackages = @($packages | Where-Object Name -NotMatch $runtimePackagePattern)

        if ($packages.Count -eq 0) { throw 'No packages found.' }

        $runtimePath = Join-Path $env:RUNNER_TEMP runtime-packages
        $pointerPath = Join-Path $env:RUNNER_TEMP pointer-package
        New-Item -ItemType Directory -Force -Path $runtimePath, $pointerPath | Out-Null

        if ($runtimePackages.Count -gt 0) {
          Copy-Item -Path $runtimePackages.FullName -Destination $runtimePath
        }
        if ($pointerPackages.Count -gt 0) {
          Copy-Item -Path $pointerPackages.FullName -Destination $pointerPath
        }

        $sleetVersion = $null
        if ($env:SLEET_FEED_URL) {
          $sleetVersion = (Invoke-RestMethod -Uri $env:SLEET_FEED_URL).'sleet:version'
        }
        if ($sleetVersion) {
          dotnet tool update sleet -g --allow-downgrade --version $sleetVersion
        } else {
          dotnet tool update sleet -g --allow-downgrade
        }

        if ($runtimePackages.Count -gt 0) {
          sleet push $runtimePath --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=$env:SLEET_CONNECTION" -p "SLEET_FEED_TYPE=azure"
        }
        if ($pointerPackages.Count -gt 0) {
          sleet push $pointerPath --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=$env:SLEET_CONNECTION" -p "SLEET_FEED_TYPE=azure"
        }
